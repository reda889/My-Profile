<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Profile</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic Multi-color Animated Background -->
  <div class="animated-bg"></div>

  <!-- Small Mute / Unmute Floating Button in Corner -->
  <button id="mute-btn" class="mute-btn" title="Mute / Unmute">
    <i id="mute-icon" class="fa-solid fa-volume-high"></i>
  </button>

  <audio id="bg-music" loop></audio>

  <!-- Full Page Layout Container -->
  <main class="page-container">
    
    <!-- Top Left Avatar & Status Container -->
    <div class="header-section">
      <div class="avatar-container">
        <img id="avatar" class="avatar" src="" alt="Avatar">
        <img id="decoration" class="decoration" src="" alt="Decoration" style="display: none;">
        <div id="status-dot" class="status-dot offline"></div>
      </div>

      <div class="user-info">
        <h1 id="display-name">Loading...</h1>
        <p id="username" class="username">@discord</p>
      </div>
    </div>

    <!-- Custom Status -->
    <div id="custom-status-container" class="custom-status-container" style="display: none;">
      <span id="custom-status-emoji"></span>
      <span id="custom-status-text"></span>
    </div>

    <!-- Social Links Section -->
    <div class="social-links">
      <a href="https://discord.com" target="_blank" class="social-btn" title="Discord">
        <i class="fa-brands fa-discord"></i>
      </a>
      <a href="https://github.com" target="_blank" class="social-btn" title="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://x.com" target="_blank" class="social-btn" title="X / Twitter">
        <i class="fa-brands fa-x-twitter"></i>
      </a>
      <a href="https://youtube.com" target="_blank" class="social-btn" title="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
