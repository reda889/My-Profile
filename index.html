<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Profile</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic Pale Baby Blue Animated Background -->
  <div class="animated-bg"></div>

  <!-- Audio Element -->
  <audio id="bg-music" loop></audio>

  <!-- Main Profile Layout -->
  <main class="profile-container">
    
    <!-- Top Header: Avatar + Nameplate Block -->
    <header class="header-block">
      <!-- Avatar Section -->
      <div class="avatar-wrapper">
        <img id="avatar" class="avatar" src="" alt="Avatar">
        <img id="decoration" class="decoration" src="" alt="Decoration" style="display: none;">
        <div id="status-dot" class="status-dot offline"></div>
      </div>

      <!-- Nameplate Box -->
      <div id="nameplate" class="nameplate-box">
        <h1 id="display-name">Loading...</h1>
        <span id="username" class="username">@username</span>
      </div>
    </header>

    <!-- Bio Box -->
    <section class="info-box bio-box">
      <h2 class="box-title">About Me</h2>
      <p id="bio">No bio available.</p>
    </section>

    <!-- Activity Box -->
    <section class="info-box activity-box">
      <h2 class="box-title">Activity</h2>
      <div id="activity-content" class="activity-content">
        No recent activity
      </div>
    </section>

    <!-- Social Media Links (No Boxes, Glowing Effect) -->
    <footer class="social-links">
      <a href="https://discord.com" target="_blank" class="social-icon" title="Discord">
        <i class="fa-brands fa-discord"></i>
      </a>
      <a href="https://github.com" target="_blank" class="social-icon" title="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://x.com" target="_blank" class="social-icon" title="X / Twitter">
        <i class="fa-brands fa-x-twitter"></i>
      </a>
      <a href="https://youtube.com" target="_blank" class="social-icon" title="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>
    </footer>

  </main>

  <!-- Mute Button at Bottom Left -->
  <button id="mute-btn" class="mute-btn" title="Mute / Unmute">
    <i id="mute-icon" class="fa-solid fa-volume-high"></i>
  </button>

  <script src="script.js"></script>
</body>
</html>
