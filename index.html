<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background: gradient + soft blobs (gives the glass something to blur) -->
  <div class="animated-bg"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <audio id="bg-music" loop></audio>

  <main class="profile-container">
    <header class="header-block">
      <div class="avatar-wrapper">
        <img id="avatar" class="avatar" src="" alt="Avatar">
        <img id="decoration" class="decoration" src="" alt="" style="display:none;">
        <div id="status-dot" class="status-dot offline"></div>
      </div>

      <div id="nameplate" class="nameplate-box glass">
        <video id="nameplate-video" class="nameplate-video" autoplay loop muted playsinline></video>
        <div class="nameplate-scrim"></div>
        <div class="nameplate-text">
          <h1 id="display-name">Loading...</h1>
          <span id="username" class="username">@username</span>
        </div>
      </div>
    </header>

    <section class="info-box glass">
      <h2 class="box-title">About me</h2>
      <p id="bio">No bio available.</p>
    </section>

    <section class="info-box glass">
      <h2 class="box-title">Activity</h2>
      <div id="activity-content" class="activity-content">No recent activity</div>
    </section>

    <footer class="social-links">
      <a href="https://discord.com" target="_blank" class="social-icon" title="Discord"><i class="fa-brands fa-discord"></i></a>
      <a href="https://github.com" target="_blank" class="social-icon" title="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="https://x.com" target="_blank" class="social-icon" title="X / Twitter"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="https://youtube.com" target="_blank" class="social-icon" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
    </footer>
  </main>

  <button id="mute-btn" class="mute-btn glass" title="Play / Mute">
    <i id="mute-icon" class="fa-solid fa-volume-xmark"></i>
  </button>

  <script src="script.js"></script>
</body>
</html>
